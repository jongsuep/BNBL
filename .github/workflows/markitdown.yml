name: Convert documents to Markdown

# PDF·워드·엑셀 파일이 푸시되면 markitdown으로 변환해 md/ 폴더에 커밋합니다.
# 원본 경로 구조를 그대로 유지합니다. 예: docs/보고서.pdf -> md/docs/보고서.md
# Actions 탭에서 수동 실행(workflow_dispatch)하면 저장소 전체를 다시 변환합니다.

on:
  push:
    paths:
      - '**/*.pdf'
      - '**/*.PDF'
      - '**/*.docx'
      - '**/*.DOCX'
      - '**/*.xlsx'
      - '**/*.XLSX'
      - '**/*.xls'
      - '**/*.XLS'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markitdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install markitdown
        run: pip install --quiet 'markitdown[pdf,docx,xlsx,xls]==0.1.7'

      - name: Convert documents
        shell: bash
        run: |
          set -uo pipefail
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## markitdown 변환 결과"
            echo
            echo "| 원본 파일 | 원본 크기 | 마크다운 파일 | 변환 후 크기 | 비율 |"
            echo "|---|---:|---|---:|---:|"
          } >> "$summary"

          failed=0
          count=0
          while IFS= read -r -d '' src; do
            rel="${src#./}"
            out="md/${rel%.*}.md"
            mkdir -p "$(dirname "$out")"
            if markitdown "$rel" -o "$out"; then
              before=$(stat -c %s "$rel")
              after=$(stat -c %s "$out")
              ratio=$(awk -v a="$after" -v b="$before" 'BEGIN { if (b > 0) printf "%.1f%%", a * 100 / b; else print "-" }')
              echo "| \`$rel\` | $(numfmt --to=iec-i --suffix=B "$before") | \`$out\` | $(numfmt --to=iec-i --suffix=B "$after") | $ratio |" >> "$summary"
              count=$((count + 1))
            else
              echo "::error file=$rel::markitdown 변환 실패"
              echo "| \`$rel\` | - | 변환 실패 | - | - |" >> "$summary"
              failed=$((failed + 1))
            fi
          done < <(find . -path ./.git -prune -o -path ./md -prune -o -type f \
                     \( -iname '*.pdf' -o -iname '*.docx' -o -iname '*.xlsx' -o -iname '*.xls' \) -print0 | sort -z)

          echo >> "$summary"
          echo "변환 성공 ${count}개, 실패 ${failed}개" >> "$summary"
          if [ "$failed" -gt 0 ]; then exit 1; fi

      - name: Commit Markdown files
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          [ -d md ] && git add md
          if git diff --cached --quiet; then
            echo "변경된 마크다운 파일이 없습니다."
            exit 0
          fi
          git commit -m "Convert documents to Markdown with markitdown"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
